name: Build FlClash Usage for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/macos-usage-cloud-build'
      - 'codex/local-control-acceptance'

permissions:
  contents: read

concurrency:
  group: build-flclash-usage-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'
  FLUTTER_SWIFT_PACKAGE_MANAGER: 'true'

jobs:
  build:
    name: Build macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            machine: arm64
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      FLCLASH_TEST_NODE: /private/tmp/flclash-ai-host-node22-${{ matrix.arch }}/Resources/ai/node
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'
          run_install: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify build environment
        run: |
          test "$(uname -m)" = '${{ matrix.machine }}'
          xcodebuild -version
          flutter --version
          go version
          node --version
          pnpm --version

      - name: Build and test AI agent host
        working-directory: packages/ai_agent_host
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm test

      - name: Prepare isolated macOS script test runtime
        working-directory: packages/ai_agent_host
        run: node scripts/package.mjs --arch ${{ matrix.arch }} --resources /private/tmp/flclash-ai-host-node22-${{ matrix.arch }}/Resources

      - name: Build and test local control runtime
        working-directory: services/control
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo test --locked
          cargo build --locked --release

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter application
        run: flutter analyze --no-fatal-infos

      - name: Test Flutter application
        run: flutter test --no-pub --reporter expanded

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          go test .
          go vet .

      - name: Build macOS DMG
        shell: bash
        run: |
          for build_attempt in 1 2 3; do
            if dart setup.dart macos --env stable -v 2>&1 | tee /private/tmp/flclash-package-build.log; then
              exit 0
            fi
            if [ "$build_attempt" -eq 3 ] || ! grep -Eq 'No route to host|Failed to open TCP connection|Could not resolve host|Connection timed out' /private/tmp/flclash-package-build.log; then
              exit 1
            fi
            sleep 10
          done

      - name: Verify built application and packaged AI runtime
        shell: bash
        run: |
          app_path='build/macos/Build/Products/Release/FlClash Usage.app'
          test -d "$app_path"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")
          display_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app_path/Contents/Info.plist")
          test "$bundle_id" = 'com.zding.flclash.usage'
          test "$display_name" = 'FlClash Usage'
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")
          /usr/bin/lipo "$app_path/Contents/MacOS/$executable_name" -verify_arch '${{ matrix.machine }}'
          resources="$app_path/Contents/Resources"
          test -x "$resources/ai/node"
          test -s "$resources/ai/host.mjs"
          test -s "$resources/ai/script_runner.mjs"
          test -s "$resources/ai/manifest.json"
          test -s "$resources/ai/NODE-LICENSE"
          /usr/bin/lipo "$resources/ai/node" -verify_arch '${{ matrix.machine }}'
          test "$("$resources/ai/node" --version)" = 'v22.23.3'
          /usr/bin/codesign --verify --strict --verbose=2 "$resources/ai/node"
          test -x "$resources/control/flclashctl"
          test -s "$resources/control/libflclash_control.dylib"
          /usr/bin/lipo "$resources/control/flclashctl" -verify_arch '${{ matrix.machine }}'
          /usr/bin/lipo "$resources/control/libflclash_control.dylib" -verify_arch '${{ matrix.machine }}'
          "$resources/control/flclashctl" --version
          "$resources/control/flclashctl" --help
          /usr/bin/codesign --verify --strict --verbose=2 "$resources/control/flclashctl"
          /usr/bin/codesign --verify --strict --verbose=2 "$resources/control/libflclash_control.dylib"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app_path"
          node packages/ai_agent_host/scripts/verify.mjs --resources "$resources"
          find dist -maxdepth 2 -type f -print

      - name: Run packaged application runtime checks
        timeout-minutes: 8
        run: python3 scripts/macos_runtime_smoke/smoke.py

      - name: Upload runtime check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Usage-runtime-${{ matrix.arch }}
          path: build/macos-runtime-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Usage-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
